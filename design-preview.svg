      <rect x="612" y="249" width="145" height="30" rx="7" fill="#24252d" stroke="#3d3f4a"/><text x="626" y="269" class="tiny muted">⌕　Search tools</text><text x="743" y="269" text-anchor="end" class="tiny muted">⌘K</text>
      <line x1="142" y1="292" x2="786" y2="292" class="line"/>
