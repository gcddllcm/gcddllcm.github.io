      <rect x="142" y="339" width="204" height="132" rx="11" fill="url(#active)" stroke="#8c80f2"/>
      <circle cx="169" cy="367" r="14" fill="#594f91"/><text x="169" y="372" text-anchor="middle" class="tiny accentText">▣</text>
      <text x="160" y="408" class="small" font-weight="700">File creator</text><text x="160" y="429" class="tiny muted">Images → Notebook</text>
      <rect x="160" y="444" width="168" height="2" rx="1" fill="#9c91ff" opacity=".8"/>
      <rect x="360" y="339" width="204" height="132" rx="11" fill="#292a34" stroke="#4b4d59"/>
      <circle cx="387" cy="367" r="14" fill="#383a47"/><text x="387" y="372" text-anchor="middle" class="tiny">▤</text>
      <text x="378" y="408" class="small" font-weight="700">Convert to PDF</text><text x="378" y="429" class="tiny muted">Notebook → PDF</text>
      <rect x="578" y="339" width="208" height="132" rx="11" fill="#292a34" stroke="#4b4d59"/>
      <circle cx="605" cy="367" r="14" fill="#383a47"/><text x="605" y="372" text-anchor="middle" class="tiny">▧</text>
      <text x="596" y="408" class="small" font-weight="700">Page locker</text><text x="596" y="429" class="tiny muted">Lock or unlock pages</text>
      <line x1="142" y1="493" x2="786" y2="493" class="line"/>
      <text x="144" y="523" class="eyebrow">IMAGE TOOLS</text>
      <rect x="142" y="539" width="204" height="102" rx="11" fill="#292a34" stroke="#4b4d59"/>
      <circle cx="169" cy="567" r="14" fill="#383a47"/><text x="169" y="572" text-anchor="middle" class="tiny">◉</text>
      <text x="160" y="608" class="small" font-weight="700">Image Resizer</text>
      <text x="764" y="646" text-anchor="end" class="tiny muted">F　Close</text>
      <!-- restrained animation streak -->
      <path d="M123 195c-23 76-22 341 0 430" fill="none" stroke="#b8afff" stroke-opacity=".4" stroke-width="2"/>
      <circle cx="123" cy="195" r="3" fill="#c9c2ff"/><circle cx="123" cy="625" r="3" fill="#8c80f2"/>
    </g>
