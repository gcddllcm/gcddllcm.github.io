    <rect x="309" y="126" width="310" height="80" rx="11" fill="#333440" stroke="#8174ed" stroke-width="1.4"/>
    <rect x="324" y="141" width="49" height="49" rx="9" fill="#443d71"/><text x="348" y="173" text-anchor="middle" font-size="20" class="accentText">▣</text>
    <text x="389" y="151" class="tiny" fill="#bab2ff">SMART NOTEBOOK</text><text x="389" y="175" font-size="17" font-weight="700">File creator</text>
    <text x="279" y="174" text-anchor="middle" font-size="17" class="muted">←</text><text x="299" y="172" text-anchor="middle" class="tiny" font-weight="700">Q</text>
    <text x="631" y="172" text-anchor="middle" class="tiny" font-weight="700">E</text><text x="649" y="174" text-anchor="middle" font-size="17" class="muted">→</text>
    <rect x="801" y="93" width="84" height="26" rx="6" fill="#2d2e38" stroke="#4a4c57"/><text x="809" y="110" font-size="10" class="muted">ALL TOOLS</text><rect x="864" y="98" width="15" height="16" rx="4" fill="#22232b" stroke="#555765"/><text x="871.5" y="110" text-anchor="middle" font-size="9" class="accentText">F</text>
    <text x="50" y="294" class="title">SMART Notebook : File creator</text>
    <text x="50" y="321" class="small muted">Turn images into a SMART Notebook, one image per page</text>
    <rect x="50" y="343" width="828" height="102" rx="7" fill="#252630" stroke="#50525e" stroke-dasharray="6 5"/>
    <text x="464" y="395" text-anchor="middle" class="body muted">Drop images or a folder here</text>
    <rect x="50" y="462" width="394" height="273" rx="7" fill="#262832" stroke="#373943"/><rect x="460" y="462" width="418" height="273" rx="7" fill="#262832" stroke="#373943"/>
    <rect x="50" y="758" width="828" height="46" rx="6" fill="#6c5ce7"/>
    <!-- dim backdrop veil -->
    <rect x="1" y="59" width="926" height="776" rx="0" fill="#111219" opacity=".58"/>
    <ellipse cx="468" cy="451" rx="390" ry="325" fill="url(#glow)" opacity=".65"/>
    <!-- Elegant expanded library panel -->
    <g filter="url(#panelShadow)">
      <rect x="112" y="170" width="704" height="500" rx="18" fill="url(#panel)" stroke="#8c80f2" stroke-opacity=".72" stroke-width="1.4"/>
      <rect x="113" y="171" width="702" height="498" rx="17" fill="none" stroke="#ffffff13"/>
      <circle cx="144" cy="205" r="14" fill="#423b70"/><text x="144" y="210" text-anchor="middle" class="small accentText">▦</text>
      <text x="170" y="201" class="eyebrow" fill="#b9b1ff">TOOL LIBRARY</text>
