    <rect x="1" y="1" width="926" height="58" rx="14" fill="#202129"/>
    <line x1="0" y1="58" x2="928" y2="58" class="line"/>
    <circle cx="32" cy="29" r="16" fill="#39344d"/><text x="32" y="35" text-anchor="middle" font-size="17">🐧</text>
    <text x="59" y="35" font-size="15" font-weight="700">Penguin Logistics</text>
    <text x="710" y="35" class="tiny muted">Tools　 What's New　 About Us</text>
    <!-- compact carousel -->
    <rect x="22" y="77" width="884" height="164" rx="11" fill="url(#bar)" stroke="#ffffff12"/>
    <text x="44" y="101" class="eyebrow">CHOOSE A TOOL</text>
    <g opacity=".2" filter="url(#blur)"><rect x="39" y="132" width="229" height="62" rx="9" fill="#383944"/><text x="72" y="169" class="small">Image Resizer</text></g>
    <g opacity=".34"><rect x="39" y="136" width="229" height="58" rx="9" fill="#30313b" stroke="#575966"/><text x="55" y="171" class="small">◉　Image Resizer</text></g>
    <g opacity=".2" filter="url(#blur)"><rect x="660" y="132" width="229" height="62" rx="9" fill="#383944"/><text x="692" y="169" class="small">Convert to PDF</text></g>
    <g opacity=".34"><rect x="660" y="136" width="229" height="58" rx="9" fill="#30313b" stroke="#575966"/><text x="676" y="171" class="small">▤　Convert to PDF</text></g>
    <rect x="309" y="126" width="310" height="80" rx="11" fill="#333440" stroke="#8174ed" stroke-width="1.4"/>
    <rect x="324" y="141" width="49" height="49" rx="9" fill="#443d71"/><text x="348" y="173" text-anchor="middle" font-size="20" class="accentText">▣</text>
    <text x="389" y="151" class="tiny" fill="#bab2ff">SMART NOTEBOOK</text><text x="389" y="175" font-size="17" font-weight="700">File creator</text>
    <text x="279" y="174" text-anchor="middle" font-size="17" class="muted">←</text><text x="299" y="172" text-anchor="middle" class="tiny" font-weight="700">Q</text>
    <text x="631" y="172" text-anchor="middle" class="tiny" font-weight="700">E</text><text x="649" y="174" text-anchor="middle" font-size="17" class="muted">→</text>
    <rect x="801" y="93" width="84" height="26" rx="6" fill="#2d2e38" stroke="#4a4c57"/>
    <text x="809" y="110" font-size="10" class="muted">ALL TOOLS</text><rect x="864" y="98" width="15" height="16" rx="4" fill="#22232b" stroke="#555765"/><text x="871.5" y="110" text-anchor="middle" font-size="9" class="accentText">F</text>
    <!-- workspace -->
    <text x="50" y="294" class="title">SMART Notebook : File creator</text>
    <text x="50" y="321" class="small muted">Turn images into a SMART Notebook, one image per page</text>
    <rect x="50" y="343" width="828" height="102" rx="7" fill="#252630" stroke="#50525e" stroke-dasharray="6 5"/>
    <text x="464" y="389" text-anchor="middle" class="body muted">Drag &amp; drop images or a folder here</text><text x="464" y="414" text-anchor="middle" class="tiny muted">(click to browse, or paste with Ctrl+V)</text>
    <rect x="50" y="462" width="394" height="273" rx="7" fill="#262832" stroke="#373943"/><rect x="460" y="462" width="418" height="273" rx="7" fill="#262832" stroke="#373943"/>
    <text x="70" y="491" class="small">Image list</text><text x="480" y="491" class="small">Preview</text>
    <rect x="70" y="509" width="354" height="34" rx="4" fill="#6c5ce7"/><text x="83" y="531" class="tiny accentText">01. IMG_7554.jpg</text>
    <rect x="70" y="550" width="354" height="34" rx="4" fill="#30313b"/><text x="83" y="572" class="tiny">02. IMG_7554.PNG</text>
    <rect x="70" y="591" width="354" height="34" rx="4" fill="#30313b"/><text x="83" y="613" class="tiny">03. IMG_7555.PNG</text>
    <rect x="568" y="511" width="202" height="196" rx="4" fill="#363742"/><path d="M582 685l48-63 38 34 37-31 51 60z" fill="#6c5ce7" opacity=".78"/><circle cx="733" cy="544" r="12" fill="#aaa0ff"/>
    <rect x="50" y="758" width="828" height="46" rx="6" fill="#6c5ce7"/><text x="464" y="787" text-anchor="middle" class="small accentText">Save as SMART Notebook</text>
  </g>

  <!-- Transition cue -->
  <g opacity=".9">
    <circle cx="1013" cy="601" r="38" fill="#8276ef" opacity=".12"/>
    <path d="M998 601h30m-11-11 11 11-11 11" fill="none" stroke="#b6afff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1013" y="656" text-anchor="middle" class="tiny muted">Press F</text>
  </g>

  <!-- Open state app backdrop -->
  <g transform="translate(1072 201)" filter="url(#shadow)">
    <rect width="928" height="836" rx="15" fill="url(#window)" stroke="#ffffff1c"/>
    <rect x="1" y="1" width="926" height="58" rx="14" fill="#202129"/>
    <line x1="0" y1="58" x2="928" y2="58" class="line"/>
    <circle cx="32" cy="29" r="16" fill="#39344d"/><text x="32" y="35" text-anchor="middle" font-size="17">🐧</text>
    <text x="59" y="35" font-size="15" font-weight="700">Penguin Logistics</text>
    <text x="710" y="35" class="tiny muted">Tools　 What's New　 About Us</text>
    <rect x="22" y="77" width="884" height="164" rx="11" fill="url(#bar)" stroke="#ffffff12"/>
    <text x="44" y="101" class="eyebrow">CHOOSE A TOOL</text>
    <g opacity=".18" filter="url(#blur)"><rect x="39" y="132" width="229" height="62" rx="9" fill="#383944"/></g>
    <g opacity=".24"><rect x="39" y="136" width="229" height="58" rx="9" fill="#30313b" stroke="#575966"/><text x="55" y="171" class="small">◉　Image Resizer</text></g>
    <g opacity=".18" filter="url(#blur)"><rect x="660" y="132" width="229" height="62" rx="9" fill="#383944"/></g>
