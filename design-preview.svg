<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1120" viewBox="0 0 2048 1120">
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#302941"/><stop offset=".45" stop-color="#1d1e25"/><stop offset="1" stop-color="#202c38"/></linearGradient>
    <linearGradient id="window" x2="0" y2="1"><stop stop-color="#1d1e25"/><stop offset="1" stop-color="#17181e"/></linearGradient>
    <linearGradient id="bar" x2="0" y2="1"><stop stop-color="#282932"/><stop offset="1" stop-color="#202129"/></linearGradient>
    <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#323141"/><stop offset=".45" stop-color="#272832"/><stop offset="1" stop-color="#222730"/></linearGradient>
    <linearGradient id="active" x2="1" y2="1"><stop stop-color="#454072"/><stop offset="1" stop-color="#302d4c"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#897cff" stop-opacity=".28"/><stop offset="1" stop-color="#6c5ce7" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".36"/></filter>
    <filter id="panelShadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="22" stdDeviation="25" flood-color="#000" flood-opacity=".56"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <style>
      text{font-family:Inter,'Segoe UI',Arial,sans-serif;fill:#f1f2f6}.muted{fill:#9498a3}.tiny{font-size:11px}.small{font-size:13px}.body{font-size:15px}.title{font-size:23px;font-weight:700}.eyebrow{font-size:10px;font-weight:750;letter-spacing:1.5px;fill:#aaa9b8}.accentText{fill:#fff;font-weight:650}.line{stroke:#ffffff13}
    </style>
  </defs>
  <rect width="2048" height="1120" fill="url(#bg)"/>
  <text x="64" y="54" class="eyebrow">PENGUIN LOGISTICS  /  TOOL SELECTOR</text>
  <text x="64" y="98" font-size="30" font-weight="750">Carousel first, full tool library on demand</text>
  <text x="64" y="128" font-size="14" class="muted">The focused carousel stays clean. Press F or open All Tools to jump directly to any tool.</text>

  <!-- State labels -->
  <text x="64" y="180" class="eyebrow">01　RESTING STATE</text>
  <text x="1056" y="180" class="eyebrow">02　TOOL LIBRARY OPEN　/　F</text>

  <!-- Closed state window -->
  <g transform="translate(48 201)" filter="url(#shadow)">
