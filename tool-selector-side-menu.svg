    <text x="482" y="119" class="tiny accentText">File creator</text>
    <text x="310" y="161" class="title">File creator</text>
    <rect x="1040" y="136" width="30" height="30" rx="7" fill="#2c2e39" stroke="#3b3d49"/><text x="1055" y="157" text-anchor="middle" class="small muted">i</text>
