    <rect x="310" y="210" width="750" height="110" rx="8" fill="url(#drop)" stroke="#555765" stroke-dasharray="6 5"/>
    <circle cx="685" cy="249" r="18" fill="#383452"/><text x="685" y="255" text-anchor="middle" font-size="18" class="accentText">↑</text>
    <text x="685" y="285" text-anchor="middle" class="body muted">Drop images or a folder here, or click to browse</text>
    <rect x="310" y="341" width="363" height="448" rx="8" fill="#262832" stroke="#373943"/>
    <rect x="688" y="341" width="372" height="448" rx="8" fill="#262832" stroke="#373943"/>
    <text x="330" y="375" class="body" font-weight="650">Images <tspan class="muted">(3)</tspan></text>
    <text x="643" y="375" text-anchor="end" class="tiny muted">Clear all</text>
    <line x1="330" y1="392" x2="653" y2="392" class="divider"/>
    <rect x="328" y="407" width="327" height="43" rx="6" fill="#6c5ce7"/>
    <text x="344" y="434" class="small accentText">01　IMG_7554.jpg</text><text x="630" y="434" text-anchor="end" class="small">⠿</text>
    <rect x="328" y="458" width="327" height="43" rx="6" fill="transparent"/>
    <text x="344" y="485" class="small">02　IMG_7554.PNG</text><text x="630" y="485" text-anchor="end" class="small muted">⠿</text>
    <rect x="328" y="509" width="327" height="43" rx="6" fill="transparent"/>
    <text x="344" y="536" class="small">03　IMG_7555.PNG</text><text x="630" y="536" text-anchor="end" class="small muted">⠿</text>
    <rect x="328" y="576" width="327" height="190" rx="6" fill="#202129" stroke="#343640"/>
    <text x="492" y="673" text-anchor="middle" class="small muted">Drag rows to reorder · Select to preview</text>
    <text x="708" y="375" class="body" font-weight="650">Preview</text><text x="1038" y="375" text-anchor="end" class="tiny muted">Fit to view</text>
    <line x1="708" y1="392" x2="1040" y2="392" class="divider"/>
    <rect x="722" y="407" width="304" height="324" rx="6" fill="#202129"/>
    <rect x="757" y="426" width="234" height="286" rx="3" fill="#353640"/>
    <rect x="775" y="446" width="198" height="247" rx="2" fill="#41424d"/>
    <path d="M785 672l64-94 45 43 36-34 34 85z" fill="#6c5ce7" opacity=".8"/><circle cx="930" cy="485" r="17" fill="#9d93ff"/>
    <text x="874" y="758" text-anchor="middle" class="tiny muted">IMG_7554.jpg</text>
    <rect x="310" y="812" width="750" height="52" rx="7" class="accent"/>
    <text x="685" y="844" text-anchor="middle" class="body accentText">Save as SMART Notebook</text>
  </g>

  <!-- Compact window -->
  <g transform="translate(1190 170)" filter="url(#shadow)">
    <rect width="440" height="930" rx="17" fill="#17181e" stroke="#ffffff20"/>
    <rect x="1" y="1" width="438" height="64" rx="16" class="navbg"/>
    <path d="M1 49h438" class="divider"/>
    <circle cx="31" cy="32" r="15" fill="#38334d"/><text x="31" y="37" text-anchor="middle" font-size="15">🐧</text>
    <text x="54" y="38" font-size="15" font-weight="700">Penguin Logistics</text>
    <text x="374" y="38" class="small muted">☰</text>
    <rect x="16" y="80" width="408" height="56" rx="9" fill="#252630" stroke="#ffffff15"/>
    <text x="36" y="114" font-size="19" class="muted">☰</text><text x="75" y="114" class="small accentText">SMART Notebook</text><text x="402" y="114" text-anchor="end" class="tiny muted">⌄</text>
    <rect x="16" y="152" width="408" height="758" rx="11" fill="#1e1f26" stroke="#ffffff0b"/>
    <text x="38" y="189" class="tiny muted">SMART Notebook　/　File creator</text>
    <text x="38" y="229" class="title">File creator</text>
    <rect x="374" y="206" width="30" height="30" rx="7" fill="#2c2e39"/><text x="389" y="227" text-anchor="middle" class="small muted">i</text>
    <text x="38" y="256" class="tiny muted">Turn images into a SMART Notebook</text>
    <rect x="38" y="278" width="364" height="104" rx="8" fill="url(#drop)" stroke="#555765" stroke-dasharray="6 5"/>
    <text x="220" y="321" text-anchor="middle" class="small muted">Drop images here</text><text x="220" y="344" text-anchor="middle" class="tiny muted">or tap to browse</text>
    <rect x="38" y="402" width="364" height="242" rx="8" fill="#262832" stroke="#373943"/>
    <text x="56" y="432" class="small" font-weight="650">Images (3)</text><text x="383" y="432" text-anchor="end" class="tiny muted">Clear all</text>
    <line x1="56" y1="448" x2="384" y2="448" class="divider"/>
    <rect x="54" y="462" width="332" height="40" rx="6" fill="#6c5ce7"/><text x="68" y="487" class="tiny accentText">01　IMG_7554.jpg</text><text x="370" y="487" text-anchor="end" class="tiny">⠿</text>
    <rect x="54" y="509" width="332" height="40" rx="6" fill="#30313b"/><text x="68" y="534" class="tiny">02　IMG_7554.PNG</text><text x="370" y="534" text-anchor="end" class="tiny muted">⠿</text>
    <rect x="54" y="556" width="332" height="40" rx="6" fill="#30313b"/><text x="68" y="581" class="tiny">03　IMG_7555.PNG</text><text x="370" y="581" text-anchor="end" class="tiny muted">⠿</text>
    <text x="56" y="624" class="tiny muted">Drag to reorder · Select to preview</text>
    <rect x="38" y="662" width="364" height="170" rx="8" fill="#262832" stroke="#373943"/>
    <text x="56" y="692" class="small" font-weight="650">Preview</text>
    <rect x="129" y="710" width="182" height="94" rx="5" fill="#353640"/>
    <path d="M143 789l47-52 37 34 28-25 42 43z" fill="#6c5ce7" opacity=".8"/><circle cx="269" cy="733" r="9" fill="#9d93ff"/>
    <rect x="38" y="852" width="364" height="42" rx="7" class="accent"/><text x="220" y="879" text-anchor="middle" class="small accentText">Save as SMART Notebook</text>
