<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1180" viewBox="0 0 1680 1180">
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#29263a"/><stop offset=".52" stop-color="#1e1f26"/><stop offset="1" stop-color="#202b36"/></linearGradient>
    <linearGradient id="drop" x2="1" y2="1"><stop stop-color="#292a34"/><stop offset="1" stop-color="#22232a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".3"/></filter>
    <style>
      text{font-family:Inter,'Segoe UI',Arial,sans-serif;fill:#f1f2f6}.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.5px;fill:#a5a8b2}.muted{fill:#9498a3}.tiny{font-size:11px}.small{font-size:13px}.body{font-size:14px}.title{font-size:23px;font-weight:700}.accent{fill:#6c5ce7}.accentText{fill:#fff;font-weight:650}.stroke{stroke:#ffffff13}.navbg{fill:#202129}.menu{fill:#252630}.soft{fill:#2b2d37}.surface{fill:#262832;stroke:#373943}.divider{stroke:#ffffff12}.outline{fill:none;stroke:#4c4f5c}.pill{fill:#383452}.success{fill:#00b894}
    </style>
  </defs>
  <rect width="1680" height="1180" fill="url(#bg)"/>
  <text x="60" y="54" class="eyebrow">PENGUIN LOGISTICS  /  SIDE MENU DESIGN</text>
  <text x="60" y="98" font-size="31" font-weight="750">A calmer tool menu that scales</text>
  <text x="60" y="130" font-size="15" class="muted">Grouped navigation · clear current location · compact behavior for smaller windows</text>

  <!-- Desktop screen -->
  <g transform="translate(48 170)" filter="url(#shadow)">
    <rect width="1110" height="930" rx="17" fill="#17181e" stroke="#ffffff20"/>
    <rect x="1" y="1" width="1108" height="64" rx="16" class="navbg"/>
    <path d="M1 49h1108" class="divider"/>
    <circle cx="34" cy="32" r="16" fill="#38334d"/><text x="34" y="37" text-anchor="middle" font-size="16">🐧</text>
    <text x="60" y="38" font-size="16" font-weight="700">Penguin Logistics</text>
    <text x="874" y="38" class="small muted">Tools</text><text x="944" y="38" class="small muted">What's New</text><text x="1042" y="38" class="small muted">About</text>

    <!-- Sidebar -->
    <rect x="16" y="80" width="244" height="832" rx="11" class="menu" stroke="#ffffff10"/>
    <text x="34" y="112" class="eyebrow">TOOLBOX</text>
    <rect x="28" y="128" width="220" height="40" rx="7" fill="#30313b"/>
    <text x="44" y="153" class="small muted">⌕</text><text x="67" y="153" class="small muted">Find a tool</text><text x="225" y="153" class="tiny muted">⌘K</text>
    <line x1="28" y1="184" x2="248" y2="184" class="divider"/>
    <text x="34" y="213" class="eyebrow">CATEGORIES</text>
    <rect x="28" y="227" width="220" height="39" rx="7" fill="#2d2e38"/>
    <text x="44" y="252" class="small">▦</text><text x="66" y="252" class="small active">SMART Notebook</text><text x="224" y="252" class="tiny muted">⌄</text>
    <rect x="38" y="274" width="200" height="44" rx="7" class="accent"/>
    <rect x="38" y="283" width="3" height="26" rx="1.5" fill="#c3bbff"/>
    <text x="56" y="293" class="small accentText">▣　File creator</text><text x="56" y="309" class="tiny" fill="#e1ddff">Current tool</text>
    <rect x="38" y="324" width="200" height="41" rx="7" fill="transparent"/>
    <text x="56" y="350" class="small muted">▤　Convert to PDF</text>
    <rect x="38" y="370" width="200" height="41" rx="7" fill="transparent"/>
    <text x="56" y="396" class="small muted">▧　Page locker</text>
    <line x1="28" y1="428" x2="248" y2="428" class="divider"/>
    <text x="44" y="460" class="small muted">▧　Image tools</text><text x="224" y="460" class="tiny muted">›</text>
    <text x="44" y="502" class="small muted">◉　Utilities</text><text x="224" y="502" class="tiny muted">›</text>
    <line x1="28" y1="868" x2="248" y2="868" class="divider"/>
    <circle cx="48" cy="891" r="11" fill="#38334d"/><text x="48" y="895" text-anchor="middle" class="tiny">?</text>
    <text x="68" y="895" class="tiny muted">Help &amp; feedback</text>

    <!-- Main workspace -->
