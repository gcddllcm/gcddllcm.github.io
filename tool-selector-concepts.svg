<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#282638"/><stop offset=".5" stop-color="#1e1f26"/><stop offset="1" stop-color="#202a35"/></linearGradient>
    <linearGradient id="drop" x2="1" y2="1"><stop stop-color="#292a34"/><stop offset="1" stop-color="#23242b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".25"/></filter>
    <style>
      text{font-family:Inter,'Segoe UI',Arial,sans-serif;fill:#f1f2f6}.muted{fill:#9498a3}.tiny{font-size:11px}.small{font-size:13px}.body{font-size:14px}.title{font-size:22px;font-weight:700}.label{font-size:11px;font-weight:700;letter-spacing:1.3px;fill:#a5a8b2}.active{fill:#fff;font-weight:700}.panel{fill:#1e1f26;stroke:#ffffff16}.line{stroke:#ffffff12}.accent{fill:#6c5ce7}.accentText{fill:#fff;font-weight:650}.btn{fill:#262832;stroke:#33353f}.soft{fill:#282a34}
    </style>
  </defs>
  <rect width="1600" height="1120" fill="url(#bg)"/>
  <text x="68" y="58" font-size="13" font-weight="700" letter-spacing="2" fill="#a5a8b2">PENGUIN LOGISTICS  /  TOOL SELECTOR CONCEPTS</text>
  <text x="68" y="106" font-size="30" font-weight="750">Three ways to choose a SMART Notebook tool</text>
  <text x="68" y="137" font-size="15" class="muted">Same dark visual style · responsive layouts · active tool shown in context</text>

  <!-- Concept 1 -->
  <g transform="translate(56 178)" filter="url(#shadow)">
    <rect width="480" height="876" rx="18" class="panel"/>
    <text x="26" y="42" class="label">01  /  QUICK SWITCHER</text>
    <text x="26" y="76" class="title">Category bar + tool tabs</text>
    <text x="26" y="101" class="small muted">One-click switching, with tools grouped in a row.</text>
    <rect x="18" y="128" width="444" height="728" rx="12" fill="#18191f" stroke="#ffffff12"/>
    <text x="38" y="164" font-size="15" font-weight="700">Penguin Logistics</text>
    <text x="368" y="164" class="small muted">Tools　What's New</text>
    <line x1="18" y1="184" x2="462" y2="184" class="line"/>
    <text x="42" y="224" class="label">SMART NOTEBOOK</text>
    <text x="42" y="251" class="small muted">Choose a tool</text>
    <rect x="38" y="271" width="404" height="56" rx="9" fill="#262832" stroke="#ffffff16"/>
    <rect x="43" y="276" width="128" height="46" rx="7" class="accent"/>
    <text x="107" y="304" text-anchor="middle" class="small accentText">File creator</text>
    <text x="236" y="304" text-anchor="middle" class="small">Convert to PDF</text>
    <text x="365" y="304" text-anchor="middle" class="small">Page locker</text>
    <text x="42" y="375" class="title">SMART Notebook : File creator</text>
    <text x="42" y="401" class="small muted">Turn images into a SMART Notebook, one image per page</text>
    <rect x="42" y="426" width="396" height="94" rx="7" fill="url(#drop)" stroke="#555765" stroke-dasharray="6 5"/>
    <text x="240" y="466" text-anchor="middle" class="body muted">Drop images or a folder here</text>
    <text x="240" y="490" text-anchor="middle" class="small muted">or click to browse</text>
    <rect x="42" y="538" width="190" height="230" rx="7" fill="#262832" stroke="#33353f"/>
    <rect x="246" y="538" width="192" height="230" rx="7" fill="#262832" stroke="#33353f"/>
    <text x="58" y="565" class="small">Image list</text><text x="262" y="565" class="small">Preview</text>
    <line x1="58" y1="583" x2="215" y2="583" class="line"/><line x1="262" y1="583" x2="420" y2="583" class="line"/>
    <rect x="58" y="600" width="158" height="29" rx="4" fill="#6c5ce7"/><text x="70" y="619" class="tiny">01. image-one.jpg</text>
    <rect x="58" y="638" width="158" height="29" rx="4" fill="#30313b"/><text x="70" y="657" class="tiny muted">02. image-two.jpg</text>
    <rect x="58" y="676" width="158" height="29" rx="4" fill="#30313b"/><text x="70" y="695" class="tiny muted">03. image-three.jpg</text>
    <rect x="276" y="600" width="132" height="124" rx="4" fill="#343640"/>
    <path d="M292 699l31-42 23 27 20-18 26 33z" fill="#6c5ce7" opacity=".75"/><circle cx="365" cy="628" r="10" fill="#9d93ff"/>
    <rect x="42" y="790" width="396" height="42" rx="6" class="accent"/><text x="240" y="816" text-anchor="middle" class="small accentText">Save as SMART Notebook</text>
    <text x="38" y="847" class="tiny muted">Best for: frequent switching between related tools</text>
  </g>

  <!-- Concept 2 -->
  <g transform="translate(560 178)" filter="url(#shadow)">
    <rect width="480" height="876" rx="18" class="panel"/>
    <text x="26" y="42" class="label">02  /  TOOL NAVIGATION</text>
    <text x="26" y="76" class="title">Grouped side menu</text>
    <text x="26" y="101" class="small muted">Persistent navigation with room to grow.</text>
    <rect x="18" y="128" width="444" height="728" rx="12" fill="#18191f" stroke="#ffffff12"/>
    <text x="38" y="164" font-size="15" font-weight="700">Penguin Logistics</text>
    <text x="368" y="164" class="small muted">Tools　What's New</text>
    <line x1="18" y1="184" x2="462" y2="184" class="line"/>
    <rect x="30" y="203" width="144" height="632" rx="8" fill="#22232b"/>
    <text x="46" y="235" class="label">SMART NOTEBOOK</text>
    <rect x="39" y="251" width="126" height="46" rx="7" class="accent"/><text x="54" y="279" class="small accentText">▣　File creator</text>
    <rect x="39" y="305" width="126" height="46" rx="7" fill="#2a2b34"/><text x="54" y="333" class="tiny">▤　Convert to PDF</text>
    <rect x="39" y="359" width="126" height="46" rx="7" fill="#2a2b34"/><text x="54" y="387" class="tiny">▧　Page locker</text>
    <line x1="44" y1="430" x2="158" y2="430" class="line"/>
    <text x="46" y="461" class="label">IMAGE TOOLS</text>
    <text x="54" y="497" class="tiny muted">Resize images</text>
    <text x="54" y="535" class="tiny muted">More tools…</text>
    <text x="197" y="234" class="title">File creator</text>
    <text x="197" y="260" class="small muted">Turn images into a SMART Notebook</text>
    <rect x="197" y="284" width="242" height="132" rx="7" fill="url(#drop)" stroke="#555765" stroke-dasharray="6 5"/>
    <text x="318" y="342" text-anchor="middle" class="small muted">Drop images here</text>
    <text x="318" y="365" text-anchor="middle" class="tiny muted">or click to browse</text>
    <rect x="197" y="434" width="242" height="244" rx="7" fill="#262832" stroke="#33353f"/>
    <text x="214" y="462" class="small">Images and preview</text>
    <rect x="214" y="481" width="208" height="31" rx="4" fill="#6c5ce7"/><text x="226" y="501" class="tiny">01. image-one.jpg</text>
    <rect x="214" y="520" width="208" height="31" rx="4" fill="#30313b"/><text x="226" y="540" class="tiny muted">02. image-two.jpg</text>
    <rect x="214" y="559" width="208" height="31" rx="4" fill="#30313b"/><text x="226" y="579" class="tiny muted">03. image-three.jpg</text>
    <rect x="214" y="609" width="208" height="49" rx="4" fill="#343640"/><text x="318" y="638" text-anchor="middle" class="tiny muted">Selected image preview</text>
    <rect x="197" y="700" width="242" height="42" rx="6" class="accent"/><text x="318" y="726" text-anchor="middle" class="small accentText">Save notebook</text>
    <text x="30" y="847" class="tiny muted">Best for: a growing library of tools</text>
  </g>

  <!-- Concept 3 -->
  <g transform="translate(1064 178)" filter="url(#shadow)">
    <rect width="480" height="876" rx="18" class="panel"/>
    <text x="26" y="42" class="label">03  /  TOOL LAUNCHER</text>
    <text x="26" y="76" class="title">Category page + cards</text>
    <text x="26" y="101" class="small muted">Choose by description, then open the workspace.</text>
    <rect x="18" y="128" width="444" height="728" rx="12" fill="#18191f" stroke="#ffffff12"/>
    <text x="38" y="164" font-size="15" font-weight="700">Penguin Logistics</text>
    <text x="368" y="164" class="small muted">Tools　What's New</text>
    <line x1="18" y1="184" x2="462" y2="184" class="line"/>
    <text x="42" y="234" class="label">TOOL CATEGORY</text>
    <rect x="42" y="252" width="396" height="66" rx="8" fill="#262832" stroke="#ffffff14"/>
    <text x="62" y="280" class="small accentText">▣　SMART Notebook</text>
    <text x="62" y="300" class="tiny muted">Create, convert, and manage Notebook files</text>
    <text x="42" y="362" class="title">Choose a tool</text>
    <text x="42" y="386" class="small muted">Select the task you want to do.</text>
    <rect x="42" y="408" width="396" height="116" rx="9" fill="#262832" stroke="#6c5ce7" stroke-width="1.5"/>
    <circle cx="78" cy="454" r="21" fill="#3a345f"/><text x="78" y="460" text-anchor="middle" font-size="18" class="accentText">＋</text>
    <text x="112" y="448" font-size="15" font-weight="700">File creator</text>
    <text x="112" y="472" class="tiny muted">Create a Notebook from images</text>
    <text x="112" y="495" class="tiny" fill="#a99fff">Open tool　→</text>
    <rect x="42" y="538" width="396" height="116" rx="9" fill="#262832" stroke="#33353f"/>
    <circle cx="78" cy="584" r="21" fill="#30313b"/><text x="78" y="590" text-anchor="middle" font-size="17" class="accentText">⇩</text>
    <text x="112" y="578" font-size="15" font-weight="700">Convert to PDF</text>
    <text x="112" y="602" class="tiny muted">Export Notebook pages as a PDF</text>
    <text x="112" y="625" class="tiny muted">Open tool　→</text>
    <rect x="42" y="668" width="396" height="116" rx="9" fill="#262832" stroke="#33353f"/>
    <circle cx="78" cy="714" r="21" fill="#30313b"/><text x="78" y="720" text-anchor="middle" font-size="17" class="accentText">▣</text>
    <text x="112" y="708" font-size="15" font-weight="700">Page locker</text>
    <text x="112" y="732" class="tiny muted">Lock or unlock Notebook page images</text>
    <text x="112" y="755" class="tiny muted">Open tool　→</text>
    <text x="38" y="847" class="tiny muted">Best for: clear discovery and first-time users</text>
  </g>
</svg>
